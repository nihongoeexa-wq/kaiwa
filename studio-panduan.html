<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Panduan Video Neexa</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2B3B70;
      --primary-hover: #1A2548;
      --text-main: #0F3540;
      --bg-stage: #0b1120;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-stage); color: #f8fafc; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }

    /* PANEL KONTROL ADMIN (OTOMATIS SEMBUNYI SAAT REKAM VIDEO!) */
    .studio-toolbar {
      width: 100%; max-width: 1180px; margin: 14px auto 8px auto; padding: 14px 18px;
      background: #1e293b; border: 1.5px solid #334155; border-radius: 16px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4); z-index: 500;
    }
    body.recording-clean .studio-toolbar { display: none !important; }
    body.recording-clean { justify-content: center; background: #0f172a; }

    .ctrl-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ctrl-select {
      background: #0f172a; color: #f8fafc; border: 1.5px solid #475569;
      padding: 9px 12px; border-radius: 10px; font-family: inherit; font-size: 12.5px; font-weight: 700;
    }
    .sbtn {
      border: none; padding: 10px 16px; border-radius: 10px; font-family: inherit;
      font-size: 12.5px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: 0.2s;
    }
    .sbtn-play { background: #2563eb; color: #fff; }
    .sbtn-rec  { background: #dc2626; color: #fff; }
    .sbtn-stop { background: #475569; color: #fff; }
    .sbtn-dl   { background: #16a34a; color: #fff; text-decoration: none; }
    .sbtn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* PANGGUNG VIDEO (BISA 9:16 HP ATAU 16:9 LAPTOP) */
    .stage-outer {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 10px; width: 100%;
    }
    .video-frame {
      position: relative; background: #F4F7FA; color: var(--text-main);
      border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.55);
      border: 4px solid #334155; display: flex; flex-direction: column;
      transition: width 0.3s ease, height 0.3s ease;
    }
    .video-frame.ratio-mobile { width: 405px; height: 720px; }
    .video-frame.ratio-desktop { width: 1024px; height: 576px; border-radius: 18px; }

    /* REPLIKA UI NEEXA DI DALAM FRAME */
    .sim-app { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #F7F9FA; }
    .video-frame.ratio-desktop .sim-app.mode-dash { flex-direction: row; }

    /* Sidebar / Navbar Simulasi */
    .sim-sidebar {
      background: #ffffff; border-bottom: 1.5px solid #e2e8f0; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
    }
    .video-frame.ratio-desktop .sim-sidebar {
      width: 210px; flex-direction: column; align-items: stretch; justify-content: flex-start;
      border-bottom: none; border-right: 2px solid #e2e8f0; padding: 14px 12px;
    }
    .sim-brand { display: flex; align-items: center; gap: 8px; }
    .sim-brand img { width: 28px; height: 28px; object-fit: contain; }
    .sim-brand span { font-size: 12px; font-weight: 800; line-height: 1.1; color: var(--text-main); }
    .sim-nav-list { display: flex; gap: 5px; overflow: hidden; }
    .video-frame.ratio-desktop .sim-nav-list { flex-direction: column; margin-top: 12px; gap: 4px; }
    .sim-nav-pill {
      padding: 6px 9px; border-radius: 9px; font-size: 11px; font-weight: 800; color: #64748b;
      display: flex; align-items: center; gap: 7px; white-space: nowrap; border: 1.5px solid transparent;
    }
    .video-frame.ratio-mobile .sim-nav-pill span.txt { display: none; }
    .sim-nav-pill.active { background: #DDF4FF; color: var(--primary); border-color: #84D8FF; }

    /* Top Header & Konten Simulasi */
    .sim-main-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .sim-topheader {
      background: #ffffff; border-bottom: 1.5px solid #e2e8f0; padding: 9px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .sim-user-left { display: flex; align-items: center; gap: 9px; }
    .sim-avatar-wrap { position: relative; width: 36px; height: 36px; }
    .sim-avatar-wrap img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #2563eb; object-fit: cover; }
    .sim-verif {
      position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px; border-radius: 50%;
      background: #2563eb; color: #fff; font-size: 8px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff;
    }
    .sim-stats { display: flex; gap: 6px; }
    .sim-pill { padding: 4px 8px; border-radius: 9px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
    .sp-sesi  { background: #ffedd5; color: #ea580c; }
    .sp-koin  { background: #fef08a; color: #b45309; }
    .sp-tiket { background: #e0f2fe; color: #0284c7; }

    .sim-body { flex: 1; padding: 14px; overflow-y: auto; position: relative; }
    .sim-body::-webkit-scrollbar { width: 0; }

    /* Kartu Komponen di Dalam Adegan */
    .sc-banner {
      background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff;
      border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative;
    }
    .sc-banner h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 800; }
    .sc-banner p { margin: 0; font-size: 11.5px; opacity: 0.92; line-height: 1.45; }
    .sc-card {
      background: #ffffff; border: 2px solid #e2e8f0; border-radius: 14px;
      padding: 13px 14px; margin-bottom: 10px;
    }
    .sc-rek-yellow {
      background: #ffffff; border: 2.5px solid #eab308; border-radius: 16px;
      padding: 14px; margin-bottom: 10px; box-shadow: 0 8px 20px rgba(234,179,8,0.14);
    }
    .sc-btn {
      width: 100%; padding: 10px 14px; border-radius: 10px; border: none;
      background: var(--primary); color: #fff; font-weight: 800; font-size: 12px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* SOROTAN SPOTLIGHT & JARI PENUNJUK OTOMATIS */
    .tour-highlight-active {
      position: relative; z-index: 40 !important;
      box-shadow: 0 0 0 4px #facc15, 0 0 22px rgba(250, 204, 21, 0.75) !important;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }
    #virtualPointer {
      position: absolute; width: 34px; height: 34px; z-index: 90; pointer-events: none;
      transition: top 0.55s cubic-bezier(0.22, 1, 0.36, 1), left 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s ease;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); display: none;
    }
    #virtualPointer.clicking { transform: scale(0.82); }
    .pointer-ring {
      position: absolute; top: -6px; left: -6px; width: 28px; height: 28px;
      border-radius: 50%; border: 3px solid #ef4444; background: rgba(239,68,68,0.22);
      animation: ptrPulse 1.1s infinite;
    }
    @keyframes ptrPulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    /* PITA SUBTITLE OTOMATIS ALA TIKTOK/REELS DI BAGIAN BAWAH VIDEO */
    .subtitle-bar {
      position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 95;
      background: rgba(15, 23, 42, 0.90); color: #ffffff; backdrop-filter: blur(6px);
      border: 1.5px solid rgba(250, 204, 21, 0.55); border-radius: 14px;
      padding: 10px 14px; text-align: center; font-size: 12.5px; font-weight: 700; line-height: 1.48;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .step-progress-top {
      height: 4px; background: #e2e8f0; width: 100%; flex-shrink: 0;
    }
    .step-progress-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #eab308); transition: width 0.35s ease;
    }
  </style>
</head>
<body>

  <!-- PANEL KONTROL PEMBUAT VIDEO -->
  <div class="studio-toolbar">
    <div class="ctrl-group">
      <strong style="font-size:13.5px; color:#38bdf8;"><i class="fas fa-film"></i> Studio Panduan Neexa:</strong>
      <select id="selModeTour" class="ctrl-select">
        <option value="PENGGUNA_BARU">1. PENGGUNA_BARU (Login, Uji Bab 13, Dashboard & Progres)</option>
        <option value="NAVIGASI_TOUR_1">2A. NAVIGASI_TOUR 1 (Menu Progres, Latihan KN/KL, Survival & Riwayat)</option>
        <option value="NAVIGASI_TOUR_2">2B. NAVIGASI_TOUR 2 (Leaderboard, Bursa Job, Toko, Koin & Panduan)</option>
        <option value="BLJ_KN" selected>3. Mode BLJ_KN (Step-by-Step Belajar Percakapan s/d Rapor)</option>
        <option value="BLJ_KL">4. Mode BLJ_KL (Step-by-Step Percakapan Live 3 Tombol & Argo)</option>
        <option value="MST_JOB">5. Mode MST_JOB (Wawancara HRD 5 Fase & Buka Bursa Job)</option>
        <option value="TOKO_KOIN">6. Mode TOKO_KOIN (Top-Up Lynk.id 24 Jam, Voucher & Tukar Koin)</option>
      </select>

      <select id="selRasioLayar" class="ctrl-select" onchange="ubahRasioPanggung()">
        <option value="mobile" selected>📱 Layar HP (9:16)</option>
        <option value="desktop">💻 Layar Laptop (16:9)</option>
      </select>

      <select id="selGenderNarator" class="ctrl-select">
        <option value="female" selected>🎙️ Suara AI Wanita (Hangat)</option>
        <option value="male">🎙️ Suara AI Pria (Antusias)</option>
      </select>
    </div>

    <div class="ctrl-group">
      <button id="btnPreviewTour" class="sbtn sbtn-play" onclick="jalankanTur(false)">
        <i class="fas fa-play"></i> Putar Preview
      </button>
      <button id="btnRecordTour" class="sbtn sbtn-rec" onclick="mulaiRekamDanJalankanTur()">
        <i class="fas fa-video"></i> Rekam &amp; Download Video
      </button>
      <button id="btnStopTour" class="sbtn sbtn-stop" onclick="hentikanTurPaksa()" disabled>
        <i class="fas fa-stop"></i> Berhenti
      </button>
      <a id="linkDownloadVideo" class="sbtn sbtn-dl" style="display:none;" download="Panduan-Neexa.webm">
        <i class="fas fa-download"></i> Download Video
      </a>
    </div>
  </div>

  <!-- PANGGUNG UTAMA VIDEO -->
  <div class="stage-outer">
    <div id="videoStageFrame" class="video-frame ratio-mobile">
      <div class="step-progress-top"><div id="barStepFill" class="step-progress-fill"></div></div>

      <!-- Area Aplikasi Simulasi -->
      <div id="simAppRoot" class="sim-app mode-dash"></div>

      <!-- Kursor Jari Penunjuk Otomatis -->
      <div id="virtualPointer">
        <div class="pointer-ring"></div>
        <i class="fas fa-hand-pointer" style="font-size:26px; color:#ffffff; text-shadow:0 2px 6px #000;"></i>
      </div>

      <!-- Subtitle Bawah Otomatis -->
      <div id="subtitleBox" class="subtitle-bar">
        Pilih mode panduan di atas lalu klik Putar Preview atau Rekam Video.
      </div>
    </div>
  </div>

<script>
  const WORKER_URL = "https://api.neexasystem.com/";
  const LOGO_URL = "https://raw.githubusercontent.com/nihongoeexa-wq/kaiwa/main/LOGO%20NEEXA.png";
  const AVA_COWOK = "https://raw.githubusercontent.com/nihongoeexa-wq/kaiwa/a3548d155f1e99eede55b0239d88db73a5664ba4/anak%20muda%20laki%20laki.png";
  const AVA_FUMI = "https://raw.githubusercontent.com/nihongoeexa-wq/kaiwa/a3548d155f1e99eede55b0239d88db73a5664ba4/sensei%20perempuan.png";
  const AVA_KEN  = "https://raw.githubusercontent.com/nihongoeexa-wq/kaiwa/a3548d155f1e99eede55b0239d88db73a5664ba4/sensei%20laki%20laki.png";

  let sedangBerjalan = false;
  let batalTur = false;
  let audioCtxTour = null;
  let sumberAudioAktif = null;
  let perekamLayar = null;
  let streamRekamLayar = null;
  let potonganRekaman = [];
  const cacheAudioNarasi = new Map();

  function ambilAuthHeaderDariSesiNeexa() {
    try {
      const raw = localStorage.getItem('neexa_auth_session_v1');
      if (!raw) return null;
      const u = JSON.parse(raw);
      if (!u || !u.email || !u.token) return null;
      return { 'X-Neexa-Auth': `${String(u.email).trim().toLowerCase()}|${u.token}` };
    } catch (e) { return null; }
  }

  function ubahRasioPanggung() {
    const r = document.getElementById('selRasioLayar').value;
    const f = document.getElementById('videoStageFrame');
    f.className = 'video-frame ' + (r === 'desktop' ? 'ratio-desktop' : 'ratio-mobile');
  }

  // Kerangka Shell Dashboard Bagian Dalam
  function bungkusShellDalam(tabAktif, isiBodyHTML, verifMode = 'suara', saldoTiket = 100, saldoKoin = 420, jmlSesi = 4, pangkat = '🌱 Kouhai') {
    const daftarMenu = [
      { id: 'dashboard', ico: 'fa-home', txt: 'Dashboard' },
      { id: 'progres', ico: 'fa-route', txt: 'Progres' },
      { id: 'latihan', ico: 'fa-microphone-alt', txt: 'Latihan' },
      { id: 'survival', ico: 'fa-map-marked-alt', txt: 'Survival' },
      { id: 'riwayat', ico: 'fa-history', txt: 'Riwayat' },
      { id: 'leaderboard', ico: 'fa-trophy', txt: 'Leaderboard' },
      { id: 'joborder', ico: 'fa-briefcase', txt: 'Bursa Job' },
      { id: 'toko', ico: 'fa-store', txt: 'Toko Tiket' },
      { id: 'tukar', ico: 'fa-coins', txt: 'Tukar Koin' }
    ];
    const verifBg = verifMode === 'buku' ? '#d97706' : '#2563eb';
    const verifIco = verifMode === 'buku' ? 'fa-book' : 'fa-check';

    return `
      <div class="sim-sidebar" id="elNavSidebar">
        <div class="sim-brand"><img src="${LOGO_URL}"><span>Smart AI<br>Conversation</span></div>
        <div class="sim-nav-list">
          ${daftarMenu.map(m => `
            <div class="sim-nav-pill ${tabAktif === m.id ? 'active' : ''}" id="nav_${m.id}">
              <i class="fas ${m.ico}"></i><span class="txt">${m.txt}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="sim-main-col">
        <div class="sim-topheader" id="elTopHeader">
          <div class="sim-user-left">
            <div class="sim-avatar-wrap" id="elAvatarVerif">
              <img src="${AVA_COWOK}">
              <span class="sim-verif" style="background:${verifBg};"><i class="fas ${verifIco}"></i></span>
            </div>
            <div>
              <div style="font-size:12.5px; font-weight:800;">Halo, <span style="color:var(--primary);">Rizki</span>!</div>
              <div id="elPangkatHeader" style="font-size:9.5px; font-weight:800; background:#dcfce7; color:#15803d; padding:1px 7px; border-radius:10px; display:inline-block;">${pangkat}</div>
            </div>
          </div>
          <div class="sim-stats" id="elStatBar">
            <span class="sim-pill sp-sesi" id="elStatSesi"><i class="fas fa-fire"></i> ${jmlSesi}</span>
            <span class="sim-pill sp-koin" id="elStatKoin"><i class="fas fa-coins"></i> ${saldoKoin}</span>
            <span class="sim-pill sp-tiket" id="elStatTiket"><i class="fas fa-ticket-alt"></i> ${saldoTiket}</span>
          </div>
        </div>
        <div class="sim-body" id="simBodyScroll">${isiBodyHTML}<div style="height:68px;"></div></div>
      </div>
    `;
  }

  // =========================================================
  // SKENARIO LENGKAP 7 MODE PANDUAN (VISUAL + NARASI AI)
  // =========================================================
  const SKENARIO_MODES = {

    // 1. MODE PENGGUNA_BARU
    PENGGUNA_BARU: [
      {
        fullScreen: true,
        target: '#btnGoogleSim',
        narasi: 'Selamat datang di Neexa System! Untuk mulai belajar, kamu cukup klik satu tombol Mulai dengan Google menggunakan akun Google pribadimu.',
        html: `
          <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; background:#F4F7FA;">
            <img src="${LOGO_URL}" style="width:54px; margin-bottom:8px;">
            <div style="font-size:13px; font-weight:800; color:#475569; margin-bottom:16px;">NEEXA System — Smart AI Conversation</div>
            <h2 style="margin:0 0 10px 0; font-size:20px; font-weight:900; line-height:1.3;">Lulus Ujian, Tapi Masih Kaku Saat Bicara & Mensetsu?</h2>
            <p style="margin:0 0 18px 0; font-size:12px; color:#64748b;">Latih reflek mendengar dan berbicara bahasa Jepang bersama AI Sensei kapan saja.</p>
            <button id="btnGoogleSim" class="sc-btn" style="max-width:280px; padding:13px; font-size:13.5px; box-shadow:0 4px 0 #1A2548;">
              <i class="fab fa-google"></i> Mulai dengan Google
            </button>
          </div>`
      },
      {
        fullScreen: true,
        target: '#kartuTujuanBelajar',
        narasi: 'Setelah masuk, isi nama panggilan dan pilih jenis kelaminmu. Lalu pilih tujuan utamamu, misalnya Belajar Bicara untuk melatih percakapan sesuai buku.',
        html: `
          <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,0.85);">
            <div style="background:#fff; border-radius:18px; padding:18px; width:100%; max-width:360px;">
              <div style="font-size:10.5px; font-weight:800; color:#2563eb; text-align:center;">LANGKAH 1 / 3</div>
              <h3 style="margin:4px 0 12px 0; font-size:16px; text-align:center;">Kenalan Singkat Yuk!</h3>
              <div style="background:#f8fafc; border:1.5px solid #cbd5e1; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; margin-bottom:8px;">Nama: Rizki</div>
              <div style="display:flex; gap:8px; margin-bottom:12px;">
                <div style="flex:1; padding:8px; border:2px solid #2563eb; background:#eff6ff; color:#1d4ed8; border-radius:9px; text-align:center; font-size:11.5px; font-weight:800;">👨 Laki-laki</div>
                <div style="flex:1; padding:8px; border:1.5px solid #e2e8f0; border-radius:9px; text-align:center; font-size:11.5px; color:#64748b; font-weight:700;">🧕 Perempuan</div>
              </div>
              <div id="kartuTujuanBelajar" style="border:2px solid #2563eb; background:#eff6ff; border-radius:11px; padding:10px 12px; margin-bottom:6px;">
                <div style="font-size:12.5px; font-weight:800;">📘 Belajar Bicara</div>
                <div style="font-size:10.5px; color:#475569;">Latihan percakapan sesuai buku & bab</div>
              </div>
              <div style="border:1.5px solid #e2e8f0; border-radius:11px; padding:9px 12px; font-size:12px; font-weight:700; color:#64748b;">💼 Wawancara Kerja</div>
            </div>
          </div>`
      },
      {
        fullScreen: true,
        target: '#pilihanBab13',
        narasi: 'Jika belum punya sertifikat, pilih modul bukumu dan bab terakhir yang dipelajari, contohnya Minna no Nihongo Bab 13. Data ini dipakai untuk mengukur titik mulai belajarmu.',
        html: `
          <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,0.85);">
            <div style="background:#fff; border-radius:18px; padding:18px; width:100%; max-width:360px; text-align:center;">
              <h3 style="margin:0 0 10px 0; font-size:15px;">Punya sertifikat Bahasa Jepang?</h3>
              <div style="padding:9px; border:2px solid #2563eb; background:#eff6ff; color:#1d4ed8; border-radius:10px; font-size:12px; font-weight:800; margin-bottom:10px;">📖 BELUM PUNYA SERTIFIKAT</div>
              <div style="padding:9px; border:2px solid #2563eb; background:#eff6ff; border-radius:10px; font-size:12px; font-weight:800; margin-bottom:10px;">📘 Modul: Minna no Nihongo</div>
              <div id="pilihanBab13" style="padding:11px; border:2px solid #eab308; background:#fefce8; border-radius:10px; font-size:12.5px; font-weight:900; color:#854d0e; margin-bottom:12px;">
                Sampai: Minna 1 — Bab 13
              </div>
              <div class="sc-btn">Lanjut ke Uji Kemampuan &rarr;</div>
            </div>
          </div>`
      },
      {
        fullScreen: true,
        target: '#micUjiSim',
        narasi: 'Selanjutnya, selesaikan Uji Kemampuan Suara singkat tiga giliran tanpa biaya tiket! Tes ini mencocokkan kemampuan bicaramu sekaligus mencairkan bonus tiket gratis pendaftar baru.',
        html: `
          <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,0.85);">
            <div style="background:#fff; border-radius:18px; padding:18px; width:100%; max-width:360px; text-align:center;">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:#2563eb; margin-bottom:8px;">
                <span>🎯 Minna Bab 13</span><span>Giliran 3 / 3</span>

  // =========================================================
  // MESIN AUDIO NARATOR AI (CHIRP3-HD WORKER + WEBAUDIO MIXER)
  // =========================================================
  function pastikanAudioContext() {
    if (!audioCtxTour) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtxTour = new AC();
    }
    if (audioCtxTour.state === 'suspended') audioCtxTour.resume();
    return audioCtxTour;
  }

  async function ambilBufferSuaraTTS(teks, lang = 'id-ID', gender = 'female') {
    const kunci = `${lang}|${gender}|${teks}`;
    if (cacheAudioNarasi.has(kunci)) return cacheAudioNarasi.get(kunci);

    const authHdr = ambilAuthHeaderDariSesiNeexa();
    if (!authHdr) return null;

    const res = await fetch(WORKER_URL + 'api/tts-tour', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHdr },
      body: JSON.stringify({ text: teks, lang: lang, gender: gender, rate: lang === 'ja-JP' ? 1.0 : 1.04 })
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.audioContent) return null;

    const bin = atob(data.audioContent);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const ctx = pastikanAudioContext();
    const audioBuf = await ctx.decodeAudioData(bytes.buffer.slice(0));
    cacheAudioNarasi.set(kunci, audioBuf);
    return audioBuf;
  }

  function putarAudioBufferTunggu(audioBuf) {
    return new Promise((resolve) => {
      if (!audioBuf || batalTur) return resolve();
      const ctx = pastikanAudioContext();
      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);
      sumberAudioAktif = src;
      src.onended = () => { sumberAudioAktif = null; resolve(); };
      src.start(0);
    });
  }

  function bicaraFallbackBrowser(teks, lang = 'id-ID') {
    return new Promise((resolve) => {
      if (!('speechSynthesis' in window) || batalTur) return setTimeout(resolve, 3500);
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(teks);
      u.lang = lang;
      u.rate = 1.03;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  async function ucapkanNarasiLangkah(teks, lang = 'id-ID', genderOverride = null) {
    if (batalTur) return;
    const gender = genderOverride || document.getElementById('selGenderNarator').value;
    try {
      const buf = await ambilBufferSuaraTTS(teks, lang, gender);
      if (buf) {
        await putarAudioBufferTunggu(buf);
        return;
      }
    } catch (e) {}
    await bicaraFallbackBrowser(teks, lang);
  }

  // =========================================================
  // MESIN PENGGERAK KURSOR, SOROTAN & PEREKAM VIDEO TAB
  // =========================================================
  function gerakkanPointerKeElemen(selector) {
    const ptr = document.getElementById('virtualPointer');
    const frame = document.getElementById('videoStageFrame');
    document.querySelectorAll('.tour-highlight-active').forEach(el => el.classList.remove('tour-highlight-active'));

    if (!selector) { ptr.style.display = 'none'; return; }
    const target = frame.querySelector(selector);
    if (!target) { ptr.style.display = 'none'; return; }

    target.classList.add('tour-highlight-active');
    const rFrame = frame.getBoundingClientRect();
    const rTarget = target.getBoundingClientRect();

    const posLeft = Math.min(rFrame.width - 42, Math.max(16, (rTarget.left - rFrame.left) + rTarget.width * 0.72));
    const posTop  = Math.min(rFrame.height - 85, Math.max(16, (rTarget.top - rFrame.top) + rTarget.height * 0.58));

    ptr.style.display = 'block';
    ptr.style.left = `${posLeft}px`;
    ptr.style.top = `${posTop}px`;

    setTimeout(() => {
      ptr.classList.add('clicking');
      setTimeout(() => ptr.classList.remove('clicking'), 240);
    }, 560);
  }

  function jedaMs(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function jalankanTur(modeRekamBersih = false) {
    if (sedangBerjalan) return;
    const kodeMode = document.getElementById('selModeTour').value;
    const langkahList = SKENARIO_MODES[kodeMode] || SKENARIO_MODES.BLJ_KN;

    const cekAuth = ambilAuthHeaderDariSesiNeexa();
    if (!cekAuth) {
      const lanjutFallback = confirm("Info: Sesi login Neexa belum terdeteksi di browser ini (pastikan sudah login di tab utama neexasystem.com pada domain yang sama agar suara AI Chirp3-HD aktif).\n\nKlik OK jika ingin tetap memutar dengan suara bawaan browser.");
      if (!lanjutFallback) return false;
    }

    sedangBerjalan = true;
    batalTur = false;
    document.getElementById('linkDownloadVideo').style.display = 'none';
    document.getElementById('btnPreviewTour').disabled = true;
    document.getElementById('btnRecordTour').disabled = true;
    document.getElementById('btnStopTour').disabled = false;
    if (modeRekamBersih) document.body.classList.add('recording-clean');

    const root = document.getElementById('simAppRoot');
    const sub = document.getElementById('subtitleBox');
    const bar = document.getElementById('barStepFill');

    // Pra-muat audio langkah pertama agar mulai mulus tanpa jeda
    for (let i = 0; i < langkahList.length; i++) {
      if (batalTur) break;
      const step = langkahList[i];
      bar.style.width = `${((i + 1) / langkahList.length) * 100}%`;

      if (step.fullScreen) {
        root.className = 'sim-app';
        root.innerHTML = step.html;
      } else {
        root.className = 'sim-app mode-dash';
        root.innerHTML = bungkusShellDalam(step.tab || 'dashboard', step.body || '');
      }

      sub.textContent = step.narasi;
      await jedaMs(180);
      gerakkanPointerKeElemen(step.target);

      await ucapkanNarasiLangkah(step.narasi, 'id-ID');
      if (batalTur) break;

      if (step.contohJepang) {
        sub.textContent = `🔊 Contoh Suara AI Sensei: 「${step.contohJepang}」`;
        await ucapkanNarasiLangkah(step.contohJepang, 'ja-JP', 'female');
      }
      await jedaMs(420);
    }

    selesaikanStatusTur();
    return true;
  }

  async function mulaiRekamDanJalankanTur() {
    try {
      pastikanAudioContext();
      streamRekamLayar = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30, preferCurrentTab: true },
        audio: true
      });

      const FrameStage = document.getElementById('videoStageFrame');
      if (window.CropTarget && streamRekamLayar.getVideoTracks()[0]?.cropTo) {
        try {
          const cropTarget = await CropTarget.fromElement(FrameStage);
          await streamRekamLayar.getVideoTracks()[0].cropTo(cropTarget);
        } catch (eCrop) {}
      }

      potonganRekaman = [];
      const mimePilihan = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
        ? 'video/webm;codecs=vp9,opus'
        : 'video/webm';

      perekamLayar = new MediaRecorder(streamRekamLayar, { mimeType: mimePilihan, videoBitsPerSecond: 3500000 });
      perekamLayar.ondataavailable = e => { if (e.data && e.data.size > 0) potonganRekaman.push(e.data); };
      perekamLayar.onstop = () => {
        document.body.classList.remove('recording-clean');
        if (streamRekamLayar) { streamRekamLayar.getTracks().forEach(t => t.stop()); streamRekamLayar = null; }
        if (potonganRekaman.length > 0) {
          const blobVideo = new Blob(potonganRekaman, { type: mimePilihan });
          const urlVid = URL.createObjectURL(blobVideo);
          const kode = document.getElementById('selModeTour').value;
          const btnDl = document.getElementById('linkDownloadVideo');
          btnDl.href = urlVid;
          btnDl.download = `Panduan-Neexa-${kode}.webm`;
          btnDl.style.display = 'inline-flex';
        }
      };

      document.body.classList.add('recording-clean');
      await jedaMs(500);
      perekamLayar.start(500);

      await jalankanTur(true);

      await jedaMs(600);
      if (perekamLayar && perekamLayar.state !== 'inactive') perekamLayar.stop();
    } catch (err) {
      document.body.classList.remove('recording-clean');
      alert('Perekaman dibatalkan atau izin rekam tab belum dipilih. Pastikan memilih Tab ini dan mencentang "Share tab audio".');
    }
  }

  function hentikanTurPaksa() {
    batalTur = true;
    if (sumberAudioAktif) { try { sumberAudioAktif.stop(); } catch (e) {} }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (perekamLayar && perekamLayar.state !== 'inactive') perekamLayar.stop();
    selesaikanStatusTur();
  }

  function selesaikanStatusTur() {
    sedangBerjalan = false;
    document.body.classList.remove('recording-clean');
    document.getElementById('virtualPointer').style.display = 'none';
    document.getElementById('btnPreviewTour').disabled = false;
    document.getElementById('btnRecordTour').disabled = false;
    document.getElementById('btnStopTour').disabled = true;
  }

  // Render panggung awal saat halaman dibuka
  document.getElementById('simAppRoot').innerHTML = bungkusShellDalam('latihan', SKENARIO_MODES.BLJ_KN[0].body);
</script>
</body>
</html>
